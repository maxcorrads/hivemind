# The iOS/iPadOS app's Xcode project, generated by XcodeGen (never edited by
# hand, and gitignored). Generate it with the XcodeGen pinned in
# macos/Tools, so no Homebrew is needed:
#
#   swift run --package-path macos/Tools xcodegen generate --spec ios/project.yml
#
# or let ios/build.sh do it. See docs/ios.md.
name: Hivemind

options:
  bundleIdPrefix: com.maxcorrads
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Keep file order and ids stable, so regenerating gives the same project.
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Unsigned by default: CI and ios/build.sh pass CODE_SIGNING_ALLOWED=NO;
    # to run on your own device, pick a team in Xcode (docs/ios.md).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # ios/build.sh overrides both from package.json and the build number.
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  # HivemindKit, the Foundation-only library the macOS apps share.
  HivemindMac:
    path: ../macos

targets:
  Hivemind:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    dependencies:
      - package: HivemindMac
        product: HivemindKit
    settings:
      base:
        # Must equal BundleID.ios in macos/Sources/HivemindKit/Identity.swift;
        # ios/build.sh checks it.
        PRODUCT_BUNDLE_IDENTIFIER: com.maxcorrads.hivemind.ios
        PRODUCT_NAME: Hivemind
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        # Sources/Assets.xcassets: the single-size 1024x1024 icon with light,
        # dark and tinted variants, rendered from web/public/icon.svg by
        # ios/scripts/render-icon.swift (ios/build.sh keeps it current). actool
        # adds CFBundleIcons to the built Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      # Written by XcodeGen on every generate (gitignored); edit the keys here.
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hivemind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # One window per scene on iPad (each its own web view and terminals).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Pairing scans the QR code Hivemind Server shows.
        NSCameraUsageDescription: Hivemind uses the camera to scan the pairing code shown by Hivemind Server on your Mac.
        # The gateway is on the local network (or a private VPN such as
        # Tailscale); Bonjour finds Macs that have remote access on.
        NSLocalNetworkUsageDescription: Hivemind connects to Hivemind Server on your Mac over your local network.
        NSBonjourServices:
          - _hivemind._tcp
        # The pairing link in the Mac's QR code: opening it (from the Camera
        # app, say) shows the pairing screen to confirm; it never pairs by
        # itself (docs/ios.md#pairing).
        CFBundleURLTypes:
          - CFBundleURLName: com.maxcorrads.hivemind.ios.pair
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - hivemind-pair
        # The gateway is reached by IP address or a .local name with a
        # self-signed certificate that the app pins itself (docs/remote-access.md).
        # ATS does not apply to IP literals; this covers .local names. No
        # arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # No UIBackgroundModes: nothing runs while the app is in the
        # background (push notifications are out of scope, docs/ios.md).

  HivemindTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: Hivemind
      - package: HivemindMac
        product: HivemindKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxcorrads.hivemind.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # End-to-end UI tests against a real Mac (docs/ios.md#end-to-end-tests).
  # Not in the Hivemind scheme: they need a running gateway and a pairing
  # link, so CI never runs them.
  HivemindUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: Hivemind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxcorrads.hivemind.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hivemind

schemes:
  HivemindE2E:
    build:
      targets:
        Hivemind: all
        HivemindUITests: [test]
    test:
      config: Debug
      targets:
        - HivemindUITests
      gatherCoverageData: false
  Hivemind:
    build:
      targets:
        Hivemind: all
        HivemindTests: [test]
    test:
      config: Debug
      targets:
        - HivemindTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
