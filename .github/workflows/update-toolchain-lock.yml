name: Update toolchain lock

on:
  push:
    branches: [ci/complete-ci-cd]

permissions:
  contents: write

jobs:
  update-lock:
    if: ${{ !contains(github.event.head_commit.message, '[toolchain-lock]') }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/complete-ci-cd

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: sync toolchain lockfile [toolchain-lock]"
          git push origin HEAD:ci/complete-ci-cd
