name: Publish verified coordination integration

# Temporary branch-only transfer helper. Its final commit removes this file,
# all provisioning workflows, and the compressed transfer data.
# Application code is NEVER executed in this contents-write job.
on:
  push:
    branches: [agent/structured-tasks-rooms-integration]
    paths: [.github/workflows/coordination-integrate.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIN: 738c1dd2cf3b89d7da35d6f8528c1a31bf83149f
      SOURCE: 4b4e8c9c49a63dc7b814442274434c176480ef3a
      VERIFIED_TREE: dcdcf54f4a53d431d64e55986114f6eef5c5d1b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and assemble the already-tested source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/structured-tasks-rooms-integration
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.coordination-transfer/{i}.b64').read_text().strip() for i in range(5))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 95701
          assert hashlib.sha256(patch).hexdigest() == '3081efa734aed73e25b2c5fcbd39586ef89b8c7cca58e4e93a9b1ddd78564121'
          Path(os.environ['RUNNER_TEMP'], 'coordination.patch').write_bytes(patch)
          PY
          git fetch origin main:refs/remotes/origin/main refs/pull/43/head:refs/remotes/origin/coordination-source
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/coordination-source)" = "$SOURCE"
          git read-tree --reset -u "$MAIN"
          # These reviewed source files preserve the assigned PRs and their
          # dependencies. The patch resolves each difference against current main.
          git checkout "$SOURCE" -- \
            BOT-PROTOCOL.md DELIVERY-PROTOCOL.md NOTIFICATIONS.md PLUGINS.md README.md ROOMS.md TASK-PROTOCOL.md \
            scripts/benchmark-inbox.ts src/cli.ts \
            src/mcp/bots.test.ts src/mcp/digests.test.ts src/mcp/inbox-delivery.test.ts src/mcp/index.ts \
            src/mcp/notifications.test.ts src/mcp/rooms.test.ts src/mcp/tasks.test.ts src/mcp/wait-loop.test.ts \
            src/server/app.ts src/server/bots.test.ts src/server/hive.test.ts src/server/hive.ts src/server/http.test.ts \
            src/server/inbox-bounds.test.ts src/server/inbox-delivery.test.ts src/server/inbox-delivery.ts \
            src/server/inbox-digests.test.ts src/server/inbox-reader.ts src/server/notifications.test.ts \
            src/server/notifications.ts src/server/plugins.test.ts src/server/plugins.ts src/server/rooms.test.ts \
            src/server/rooms.ts src/server/serve.ts src/server/tasks.test.ts src/server/tasks.ts \
            src/server/telegram.test.ts src/server/telegram.ts src/server/wait-format.ts \
            src/shared/bot-message.ts src/shared/digest.ts src/shared/launch-prompt.test.ts src/shared/launch-prompt.ts \
            src/shared/message-target.ts src/shared/notifications.ts src/shared/plugin-settings.ts src/shared/rooms.ts \
            src/shared/standing-orders.ts src/shared/tasks.ts src/shared/types.ts \
            web/App.tsx web/Bots.tsx web/InboxReceipt.tsx web/LaunchSheet.tsx web/ProjectPlugins.tsx web/RoomPanel.tsx \
            web/TaskCard.tsx web/api.ts web/bots.test.tsx web/inbox-delivery.test.tsx web/plugins.test.tsx \
            web/room-retry.test.tsx web/room-state.ts web/rooms.test.tsx web/styles.css web/tasks.test.tsx web/thread-state.ts
          # Current-main README has an existing trailing blank line. Preserve it
          # byte-for-byte; the actual PR diff must independently pass diff-check.
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/coordination.patch"
          git diff --cached --check "$MAIN"
          git diff --cached --quiet "$MAIN" -- .github LICENSE .oxlintrc.json
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n\n%s\n' 'feat(coordination): integrate structured tasks and room contracts' 'Preserve reviewed PR #41/#43 ancestry and current main. Publish the exact tree validated with 332 tests on Node 22.13.0 and Node 24, unchanged quality gates, and adversarial contract regressions.' | git commit-tree "$VERIFIED_TREE" -p "$GITHUB_SHA" -p "$MAIN" -p "$SOURCE")
          printf '%s\n' "$commit" > "$RUNNER_TEMP/coordination-commit"
          printf 'Verified integration commit: %s\nTree: %s\n' "$commit" "$VERIFIED_TREE"
      - name: Fast-forward only the isolated implementation branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit=$(cat "$RUNNER_TEMP/coordination-commit")
          test "$(git rev-parse "$commit^{tree}")" = "$VERIFIED_TREE"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/agent/structured-tasks-rooms-integration"
          printf '## Published source\n\nCommit: `%s`\n\nTree: `%s`\n\nOnly the implementation branch was updated. Normal PR CI must run separately.\n' "$commit" "$VERIFIED_TREE" >> "$GITHUB_STEP_SUMMARY"
