name: Review test dependencies
on:
  push:
    branches: [maintenance/review-repair-workspace-20260918]
    paths: [.github/workflows/review-test-deps.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b4e8c9c49a63dc7b814442274434c176480ef3a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - name: Prepare test-only workspace dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes zsh
          mkdir -p review-test-deps/tools/lib
          cp /usr/bin/zsh review-test-deps/tools/zsh
          ldd /usr/bin/zsh | awk '/libpcre|libtinfo/ { print $3 }' | xargs -r -I{} cp {} review-test-deps/tools/lib/
          tar czf review-test-deps/node_modules.tgz node_modules
          zsh --version > review-test-deps/zsh-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: review-test-deps
          path: review-test-deps/
          retention-days: 1
