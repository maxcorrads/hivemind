name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const conventional = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?(!)?: .+/i;
          if (!conventional.test(title)) {
            console.error(`Invalid PR title: "${title}"`);
            console.error("Use e.g. feat: ..., fix(api): ..., or chore(deps): ...");
            process.exit(1);
          }
          NODE

  quality:
    name: Quality / build / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck server and web
        run: npm run typecheck

      - name: Build web UI and compiled CLI
        run: npm run build

      - name: Validate and smoke-test release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          package_file="$(npm pack --silent --pack-destination artifacts | tail -n 1)"
          echo "Packed artifacts/$package_file"
          tar -tzf "artifacts/$package_file" | sort
          npm sbom --sbom-format cyclonedx > artifacts/SBOM.cdx.json
          node -e 'const fs=require("fs"); const sbom=JSON.parse(fs.readFileSync("artifacts/SBOM.cdx.json","utf8")); if (!sbom.bomFormat || !sbom.metadata) process.exit(1)'
          bash scripts/smoke-package.sh "artifacts/$package_file"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit_node24:
    name: Unit / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit contracts with coverage
        run: |
          mkdir -p artifacts/coverage
          node scripts/run-logged.mjs artifacts/unit-node24.log npm run test:unit -- \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=artifacts/coverage/unit.info

      - name: Upload unit coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node24-unit
          path: artifacts/coverage/unit.info
          retention-days: 1

      - name: Retain redacted failing unit log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-24-unit
          path: artifacts/unit-node24.log
          retention-days: 7
          if-no-files-found: ignore

  integration_node24:
    name: Integration / Node 24 / shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Integration shard with coverage
        run: |
          mkdir -p artifacts/coverage
          node scripts/run-logged.mjs artifacts/integration-node24-${{ matrix.shard }}.log npm run test:integration -- \
            --hivemind-shard=${{ matrix.shard }}/4 \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=artifacts/coverage/integration-${{ matrix.shard }}.info

      - name: Upload integration coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node24-integration-${{ matrix.shard }}
          path: artifacts/coverage/integration-${{ matrix.shard }}.info
          retention-days: 1

      - name: Retain redacted failing integration log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-24-integration-${{ matrix.shard }}
          path: artifacts/integration-node24-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: ignore

  unit_node22:
    name: Unit / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the engines floor; 22.x tracks the latest Node 22 release
        # so node:sqlite / runtime changes in newer 22 minors are caught early.
        node: ['22.13.0', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit contracts
        run: node scripts/run-logged.mjs artifacts/unit-node${{ matrix.node }}.log npm run test:unit

      - name: Retain redacted failing unit log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-${{ matrix.node }}-unit
          path: artifacts/unit-node${{ matrix.node }}.log
          retention-days: 7
          if-no-files-found: ignore

  integration_node22:
    name: Integration / Node ${{ matrix.node }} / shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22.x']
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Integration shard
        run: |
          node scripts/run-logged.mjs artifacts/integration-node${{ matrix.node }}-${{ matrix.shard }}.log npm run test:integration -- \
            --hivemind-shard=${{ matrix.shard }}/4

      - name: Retain redacted failing integration log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-${{ matrix.node }}-integration-${{ matrix.shard }}
          path: artifacts/integration-node${{ matrix.node }}-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: ignore

  # The required aggregate. macos_compat is the Node suite's own macOS lane;
  # the Apple app jobs (macos_apps, ios_app) are informational and must never
  # be listed here, so a macOS or Xcode runner problem cannot block a merge.
  tests_node24:
    name: Tests / Node 24
    needs: [unit_node24, integration_node24, macos_compat, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Node 24 test shard, macOS compatibility and the browser suite
        env:
          UNIT_RESULT: ${{ needs.unit_node24.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node24.result }}
          MACOS_RESULT: ${{ needs.macos_compat.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$BROWSER_RESULT" = success

  tests_node22:
    name: Tests / Node 22.13.0
    needs: [unit_node22, integration_node22]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Historical required check name; it gates both the 22.13.0 floor and
      # the 22.x latest lane so a regression in a newer Node 22 release blocks.
      - name: Require every Node 22 (22.13.0 floor and 22.x latest) test shard
        env:
          UNIT_RESULT: ${{ needs.unit_node22.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node22.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run deterministic browser contracts
        run: node scripts/run-logged.mjs artifacts/browser.log npm run test:browser

      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chromium-failures
          path: |
            artifacts/browser.log
            artifacts/playwright
          retention-days: 7
          if-no-files-found: ignore

  macos_compat:
    name: macOS compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native macOS shell
        run: zsh --version

      - name: Run macOS-specific launch and shell contracts
        env:
          # This job does not go through scripts/run-tests.mjs, which sets the same fixture.
          HIVEMIND_FIXTURE_PROJECT: acme
        run: node scripts/run-logged.mjs artifacts/macos-compat.log node --import tsx --test src/shared/launch-prompt.test.ts src/server/bot-definitions.test.ts

      - name: Retain redacted failing macOS compatibility log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-compat-failure
          path: artifacts/macos-compat.log
          retention-days: 7
          if-no-files-found: ignore

  macos_apps:
    name: macOS apps
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # build.sh packs the server with `npm pack`, whose prepack build needs dev dependencies.
      - name: Install locked dependencies
        run: npm ci

      - name: Show Swift toolchain
        run: swift --version

      - name: Swift unit tests
        run: swift test --package-path macos

      - name: Read pinned Node.js version
        id: bundled-node
        run: echo "version=$(sed -n 's/^NODE_VERSION="\(.*\)"$/\1/p' macos/build.sh)" >> "${GITHUB_OUTPUT}"

      # Only the release tarballs and SHASUMS are cached: build.sh re-verifies
      # them against its pinned checksums on every run, whereas a cached
      # extracted binary would be trusted as is.
      - name: Restore Node.js release downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/.cache/node/node-*.tar.gz
            macos/.cache/node/SHASUMS256-*.txt
          key: macos-node-${{ steps.bundled-node.outputs.version }}

      # macos-latest runs on Apple Silicon, so build.sh also runs the
      # bundled CLI's --help there.
      - name: Build Apple Silicon app bundles
        run: ./macos/build.sh

      # ditto keeps the bundles' symlinks, permissions and ad-hoc signatures intact.
      - name: Zip app bundles
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent macos/dist/Hivemind.app artifacts/Hivemind-macOS.zip
          ditto -c -k --keepParent "macos/dist/Hivemind Server.app" artifacts/Hivemind-Server-macOS.zip

      - name: Upload Hivemind.app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hivemind-macOS
          path: artifacts/Hivemind-macOS.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload Hivemind Server.app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hivemind-Server-macOS
          path: artifacts/Hivemind-Server-macOS.zip
          retention-days: 7
          if-no-files-found: error

  ios_app:
    name: iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The app targets iOS 26, whose SDK ships with Xcode 26. Use the runner's
      # default Xcode when it is new enough, else the newest Xcode 26+ it has.
      - name: Select Xcode 26 or later
        run: |
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          if [ "${major:-0}" -lt 26 ]; then
            newest=""
            for app in /Applications/Xcode_2[6-9]*.app; do if [ -d "$app" ]; then newest="$app"; fi; done
            if [ -z "$newest" ]; then
              echo "::error::The iOS app needs Xcode 26 or later; this runner has Xcode ${major:-none}"
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      # Generates ios/Hivemind.xcodeproj with the XcodeGen pinned in
      # macos/Tools (built from source by SwiftPM, no Homebrew), then builds the
      # app unsigned (CODE_SIGNING_ALLOWED=NO) for devices and for the
      # Simulator and packages both into ios/dist/ (docs/ios.md).
      - name: Build unsigned device and Simulator apps
        run: ./ios/build.sh

      # xcodebuild test needs a concrete Simulator: the first available iPhone
      # on the newest iOS runtime from 26.0 up to the selected Xcode's SDK (a
      # runner may also carry runtimes of other Xcodes, which this one cannot use).
      - name: Pick an iPhone Simulator
        id: simulator
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          sdk = tuple(int(part) for part in sys.argv[1].split(".")[:2])
          def version(runtime):
              match = re.search(r"\.iOS-(\d+)-(\d+)$", runtime)
              return tuple(map(int, match.groups())) if match else None
          runtimes = sorted((v, r) for r in devices if (v := version(r)) and (26, 0) <= v <= sdk)
          for _, runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  print("Testing on", phones[0]["name"], runtime, file=sys.stderr)
                  break
          ' "$sdk")"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone Simulator with iOS 26.0 to $sdk"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "${GITHUB_OUTPUT}"

      # The only step that boots a Simulator. Simulator builds are signed ad hoc
      # ("Sign to Run Locally"), which needs no team or certificate.
      - name: iOS unit tests
        run: |
          mkdir -p artifacts
          xcodebuild test \
            -project ios/Hivemind.xcodeproj -scheme Hivemind \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ios/build/TestDerivedData \
            -resultBundlePath artifacts/HivemindTests.xcresult \
            -quiet

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hivemind-iOS-unsigned
          path: ios/dist/Hivemind-iOS-*-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload Simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hivemind-iOS-Simulator
          path: ios/dist/Hivemind-iOS-Simulator-*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Retain failing iOS test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-tests-failure
          path: artifacts/HivemindTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit_node24, integration_node24]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful coverage producers
        env:
          UNIT_RESULT: ${{ needs.unit_node24.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node24.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download Node 24 coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-node24-*
          path: artifacts/coverage-inputs
          merge-multiple: true

      - name: Merge coverage and enforce unchanged thresholds
        run: |
          node scripts/merge-lcov.mjs \
            --input=artifacts/coverage-inputs \
            --output=artifacts/coverage/lcov.info \
            --lines=80 \
            --branches=75 \
            --functions=75

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
