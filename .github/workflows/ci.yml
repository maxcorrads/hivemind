name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const conventional = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?(!)?: .+/i;
          if (!conventional.test(title)) {
            console.error(`Invalid PR title: "${title}"`);
            console.error("Use e.g. feat: ..., fix(api): ..., or chore(deps): ...");
            process.exit(1);
          }
          NODE

  quality:
    name: Quality / build / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck server and web
        run: npm run typecheck

      - name: Build production web UI
        run: npm run build

      - name: Validate and smoke-test release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          package_file="$(npm pack --silent --pack-destination artifacts | tail -n 1)"
          echo "Packed artifacts/$package_file"
          tar -tzf "artifacts/$package_file" | sort
          npm sbom --sbom-format cyclonedx > artifacts/SBOM.cdx.json
          node -e 'const fs=require("fs"); const sbom=JSON.parse(fs.readFileSync("artifacts/SBOM.cdx.json","utf8")); if (!sbom.bomFormat || !sbom.metadata) process.exit(1)'
          bash scripts/smoke-package.sh "artifacts/$package_file"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit_node24:
    name: Unit / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit contracts with coverage
        run: |
          mkdir -p artifacts/coverage
          node scripts/run-logged.mjs artifacts/unit-node24.log npm run test:unit -- \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=artifacts/coverage/unit.info

      - name: Upload unit coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node24-unit
          path: artifacts/coverage/unit.info
          retention-days: 1

      - name: Retain redacted failing unit log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-24-unit
          path: artifacts/unit-node24.log
          retention-days: 7
          if-no-files-found: ignore

  integration_node24:
    name: Integration / Node 24 / shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Integration shard with coverage
        run: |
          mkdir -p artifacts/coverage
          node scripts/run-logged.mjs artifacts/integration-node24-${{ matrix.shard }}.log npm run test:integration -- \
            --hivemind-shard=${{ matrix.shard }}/4 \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=artifacts/coverage/integration-${{ matrix.shard }}.info

      - name: Upload integration coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node24-integration-${{ matrix.shard }}
          path: artifacts/coverage/integration-${{ matrix.shard }}.info
          retention-days: 1

      - name: Retain redacted failing integration log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-24-integration-${{ matrix.shard }}
          path: artifacts/integration-node24-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: ignore

  unit_node22:
    name: Unit / Node 22.13.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit contracts
        run: node scripts/run-logged.mjs artifacts/unit-node22.log npm run test:unit

      - name: Retain redacted failing unit log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-22-unit
          path: artifacts/unit-node22.log
          retention-days: 7
          if-no-files-found: ignore

  integration_node22:
    name: Integration / Node 22.13.0 / shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Integration shard
        run: |
          node scripts/run-logged.mjs artifacts/integration-node22-${{ matrix.shard }}.log npm run test:integration -- \
            --hivemind-shard=${{ matrix.shard }}/2

      - name: Retain redacted failing integration log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-node-22-integration-${{ matrix.shard }}
          path: artifacts/integration-node22-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: ignore

  tests_node24:
    name: Tests / Node 24
    needs: [unit_node24, integration_node24, macos_compat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Node 24 test shard and macOS compatibility
        env:
          UNIT_RESULT: ${{ needs.unit_node24.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node24.result }}
          MACOS_RESULT: ${{ needs.macos_compat.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$MACOS_RESULT" = success

  tests_node22:
    name: Tests / Node 22.13.0
    needs: [unit_node22, integration_node22]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Node 22.13.0 test shard
        env:
          UNIT_RESULT: ${{ needs.unit_node22.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node22.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run deterministic browser contracts
        run: node scripts/run-logged.mjs artifacts/browser.log npm run test:browser

      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chromium-failures
          path: artifacts/browser.log
          retention-days: 7
          if-no-files-found: ignore

  macos_compat:
    name: macOS compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native macOS shell
        run: zsh --version

      - name: Run macOS-specific launch and shell contracts
        run: node scripts/run-logged.mjs artifacts/macos-compat.log node --import tsx --test src/shared/launch-prompt.test.ts src/server/plugins.test.ts

      - name: Retain redacted failing macOS compatibility log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-compat-failure
          path: artifacts/macos-compat.log
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit_node24, integration_node24]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful coverage producers
        env:
          UNIT_RESULT: ${{ needs.unit_node24.result }}
          INTEGRATION_RESULT: ${{ needs.integration_node24.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download Node 24 coverage shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-node24-*
          path: artifacts/coverage-inputs
          merge-multiple: true

      - name: Merge coverage and enforce unchanged thresholds
        run: |
          node scripts/merge-lcov.mjs \
            --input=artifacts/coverage-inputs \
            --output=artifacts/coverage/lcov.info \
            --lines=80 \
            --branches=75 \
            --functions=75

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
