name: Coordination shell test input

# Temporary branch-only fixture provisioning; removed before the feature PR.
on:
  push:
    branches: [agent/structured-tasks-rooms-integration]
    paths: [.github/workflows/coordination-shell.yml]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 5
    steps:
      - name: Provision real zsh for launch-script regressions
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends zsh
          mkdir -p shell-input
          zsh --version > shell-input/version.txt
          dpkg-query -W zsh zsh-common > shell-input/packages.txt
          tar -czf shell-input/zsh.tgz /bin/zsh /usr/lib/x86_64-linux-gnu/zsh /usr/share/zsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coordination-shell
          path: shell-input
          retention-days: 1
