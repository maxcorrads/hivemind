name: Storage validation workspace

on:
  push:
    branches: [work/storage-validation-20260918]
    paths: [.github/workflows/storage-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'
      - run: npm ci
      - name: Archive tracked sources, locked dependencies and test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-runtime
          cp "$(command -v node)" validation-runtime/node22
          git rev-parse HEAD > validation-runtime/source-sha.txt
          tar --exclude=.git -czf "$RUNNER_TEMP/storage-workspace.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-workspace
          path: ${{ runner.temp }}/storage-workspace.tar.gz
          retention-days: 1
