name: Stage final reviewed PR trees

# Temporary tooling, never merged. Workflow changes are applied separately by
# the GitHub connector, not by this contents-only Actions credential.
on:
  push:
    branches: [chore/reconciliation-object-staging-20260919]
    paths: [.github/workflows/reconciliation-final.yml]

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'maxcorrads/hivemind'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout immutable review inputs without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d4bc2491a1552aea53f286ba9a2f4bc8068b69ea
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patches and exact output trees
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/reconciliation-final"
          mkdir -p "$result"
          base64 --decode .github/reconciliation/thread-status.patch.gz.b64 | gzip -dc > "$result/thread-status.patch"
          base64 --decode .github/reconciliation/browser-final.patch.gz.b64 | gzip -dc > "$result/browser.patch"
          echo "160665e0be056c61f589d56f95a043bd4a63ac2fc6a5e3bdbf50264b27e96112  $result/thread-status.patch" | sha256sum --check
          echo "f9e5e536524e95c09fade5e6175d2b77ce91b12233f943af4420aea6d229cb17  $result/browser.patch" | sha256sum --check
          base=2f72542a6a95006609a4f201cd0d69be3204d3c0
          git checkout --detach "$base"
          git apply --index --check "$result/thread-status.patch"
          git apply --index "$result/thread-status.patch"
          tree63=$(git write-tree)
          test "$tree63" = 79d94d1888bcbd034f8b8d859170ba68c42ccd86
          commit63=$(printf '%s\n' 'fix(ui): reconcile live status in the selected thread' '' 'Update the open thread as well as channel metadata. Retain the latest selected-thread status during its exact HTTP request without retaining obsolete request state. Add initial-load, refresh, isolation and bounded-state regressions.' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree63" -p "$base")
          git apply --index --check "$result/browser.patch"
          git apply --index "$result/browser.patch"
          tree82=$(git write-tree)
          test "$tree82" = 186d8cfc0cc088579d16e7135997d23c883e8c21
          cp .github/workflows/ci.yml "$result/final-ci.yml"
          # The Actions token does not have workflows permission. Export only
          # source objects with CI unchanged; the connector supplies CI later.
          git checkout "$base" -- .github/workflows/ci.yml
          source82tree=$(git write-tree)
          test "$source82tree" = 083064b41ee425140035d99289848670510e527e
          git diff --exit-code "$base" "$source82tree" -- .github/workflows
          source82=$(printf '%s\n' 'test(browser): stage reviewed source objects without CI changes' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$source82tree" -p "$commit63")
          git update-ref refs/heads/reconciliation/pr-63-final-objects-20260919 "$commit63"
          git update-ref refs/heads/reconciliation/pr-82-source-objects-20260919 "$source82"
          git bundle create "$result/objects.bundle" refs/heads/reconciliation/pr-63-final-objects-20260919 refs/heads/reconciliation/pr-82-source-objects-20260919
          printf '{"commit63":"%s","tree63":"%s","source82":"%s","source82tree":"%s","final82tree":"%s"}\n' "$commit63" "$tree63" "$source82" "$source82tree" "$tree82" > "$result/result.json"
          git diff "$tree63" "$source82tree" --stat
      - name: Export only the two new non-product source staging refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --atomic origin refs/heads/reconciliation/pr-63-final-objects-20260919 refs/heads/reconciliation/pr-82-source-objects-20260919
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconciliation-final-objects
          path: ${{ runner.temp }}/reconciliation-final/
          retention-days: 1
          if-no-files-found: error
