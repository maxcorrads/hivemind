name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: macos-latest
    # The macOS app build adds several minutes to the checks.
    timeout-minutes: 45
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main

      - name: Checkout released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Re-run release checks
        if: ${{ steps.release.outputs.release_created }}
        run: npm run check

      - name: Build installable package
        if: ${{ steps.release.outputs.release_created }}
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          package_file="$(npm pack --silent --pack-destination release-artifacts | tail -n 1)"
          package_path="release-artifacts/${package_file}"
          npm sbom --sbom-format cyclonedx > release-artifacts/SBOM.cdx.json
          shasum -a 256 "${package_path}" release-artifacts/SBOM.cdx.json > release-artifacts/SHA256SUMS.txt
          echo "package_file=${package_path}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test packaged release
        if: ${{ steps.release.outputs.release_created }}
        run: bash scripts/smoke-package.sh "${{ steps.package.outputs.package_file }}"

      - name: Enforce coverage thresholds
        if: ${{ steps.release.outputs.release_created }}
        run: npm run test:coverage

      - name: Attest package provenance
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package_file }}

      # The npm package, its SBOM and SHA256SUMS.txt go up first, so a failing
      # macOS build below can never leave the release without them.
      - name: Attach package to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${{ steps.package.outputs.package_file }}" \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/SBOM.cdx.json \
            --clobber

      # No download cache here: the release always fetches Node.js fresh and
      # build.sh verifies it against the checksums pinned in the script.
      - name: Build macOS apps
        if: ${{ steps.release.outputs.release_created }}
        id: macos
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos
          ./macos/build.sh
          version="$(node -p 'require("./package.json").version')"
          ui_zip="release-artifacts/Hivemind-macOS-${version}.zip"
          server_zip="release-artifacts/Hivemind-Server-macOS-${version}.zip"
          # ditto keeps the bundles' symlinks, permissions and ad-hoc signatures intact.
          ditto -c -k --keepParent macos/dist/Hivemind.app "${ui_zip}"
          ditto -c -k --keepParent "macos/dist/Hivemind Server.app" "${server_zip}"
          echo "ui_zip=${ui_zip}" >> "${GITHUB_OUTPUT}"
          echo "server_zip=${server_zip}" >> "${GITHUB_OUTPUT}"

      - name: Attest macOS app provenance
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.macos.outputs.ui_zip }}
            ${{ steps.macos.outputs.server_zip }}

      # SHA256SUMS.txt gains the zips' lines only together with the zips, and
      # is replaced on the release in the same upload.
      - name: Attach macOS apps to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UI_ZIP: ${{ steps.macos.outputs.ui_zip }}
          SERVER_ZIP: ${{ steps.macos.outputs.server_zip }}
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 "${UI_ZIP}" "${SERVER_ZIP}" >> release-artifacts/SHA256SUMS.txt
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${UI_ZIP}" \
            "${SERVER_ZIP}" \
            release-artifacts/SHA256SUMS.txt \
            --clobber
