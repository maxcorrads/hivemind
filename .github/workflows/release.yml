name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          target-branch: main

      - name: Checkout released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Re-run release checks
        if: ${{ steps.release.outputs.release_created }}
        run: npm run check

      - name: Build installable package
        if: ${{ steps.release.outputs.release_created }}
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          package_file="$(npm pack --silent --pack-destination release-artifacts)"
          package_path="release-artifacts/${package_file}"
          shasum -a 256 "${package_path}" > release-artifacts/SHA256SUMS.txt
          echo "package_file=${package_path}" >> "${GITHUB_OUTPUT}"

      - name: Attest package provenance
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package_file }}

      - name: Attach package to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${{ steps.package.outputs.package_file }}" \
            release-artifacts/SHA256SUMS.txt \
            --clobber
