name: Coordination integration inputs

# Temporary, branch-scoped integration helper. Removed before the feature PR is ready.
on:
  push:
    branches: [agent/structured-tasks-rooms-integration]
    paths: [.github/workflows/coordination-bootstrap.yml]

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cc079096f98738393ddd604fc383812c70071e84
          fetch-depth: 0
          persist-credentials: false
          path: baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'
      - name: Fetch immutable review inputs
        working-directory: baseline
        run: |
          set -euo pipefail
          git fetch origin refs/pull/41/head:refs/heads/review-41 refs/pull/43/head:refs/heads/review-43
          test "$(git rev-parse review-41)" = f5a173a33a749834ba418ec80d3d96726c874c25
          test "$(git rev-parse review-43)" = 4b4e8c9c49a63dc7b814442274434c176480ef3a
          git branch review-main cc079096f98738393ddd604fc383812c70071e84
          git bundle create ../coordination.bundle review-main review-41 review-43
          git worktree add --detach ../candidate 4b4e8c9c49a63dc7b814442274434c176480ef3a
      - name: Install locked baseline dependencies
        working-directory: baseline
        run: npm ci
      - name: Install locked candidate dependencies
        working-directory: candidate
        run: npm ci
      - name: Package public source and isolated runtimes
        run: |
          set -euo pipefail
          mkdir -p runtime
          cp "$(command -v node)" runtime/node
          node --version > runtime/version.txt
          tar -czf coordination-inputs.tgz coordination.bundle runtime baseline/node_modules candidate/node_modules
          sha256sum coordination-inputs.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coordination-inputs
          path: coordination-inputs.tgz
          retention-days: 1
