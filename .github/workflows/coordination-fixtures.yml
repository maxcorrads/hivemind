name: Assemble verified coordination fixture fixes

# Isolated diagnostic branch. Creates immutable Git objects only; no ref writes,
# no application execution, no main changes, and no quality-gate changes.
on:
  push:
    branches: [agent/coordination-codeql-diagnostics]
    paths: [.github/workflows/coordination-fixtures.yml]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 795601572978fe7e9b6ad822f77908b7ecd38284
          persist-credentials: false
      - name: Verify the already-tested patch and create its immutable commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          parent = '795601572978fe7e9b6ad822f77908b7ecd38284'
          expected_tree = '292b0ae3c8dd4b10baa4672635c801368dd4e34a'
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 3889
          assert hashlib.sha256(patch).hexdigest() == '1c0791f2bacbd815db97157935da44199fe42d726017f9244154cb8c6d79883c'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == parent
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree') == expected_tree
          paths = ['src/server/plugins.test.ts', 'web/plugins.test.tsx']
          assert git('diff', '--cached', '--name-only').splitlines() == paths
          def create(endpoint, payload):
              request = urllib.request.Request('https://api.github.com/repos/maxcorrads/hivemind/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              blob = create('git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})
              assert blob['sha'] == git('hash-object', path)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = create('git/trees', {'base_tree': '091cc71f5658e8ae76c7b2e25aeed1c0a4d65a73', 'tree': entries})
          assert tree['sha'] == expected_tree
          commit = create('git/commits', {'message': 'test(plugins): strengthen HTML and shell safety fixtures', 'tree': expected_tree, 'parents': [parent]})
          result = {'commit': commit['sha'], 'tree': expected_tree, 'parent': parent, 'files': paths}
          Path('publication.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coordination-fixture-commit
          path: publication.json
          retention-days: 1
