name: Reconciliation snapshot

on:
  push:
    branches: [chore/pr-reconciliation-snapshot-20260919]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout committed repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export reviewed integration objects only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git bundle create snapshot/hivemind.bundle --all
          git bundle verify snapshot/hivemind.bundle
          cd snapshot
          sha256sum hivemind.bundle > SHA256SUMS
      - name: Retain temporary final integration snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconciliation-final-base
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
