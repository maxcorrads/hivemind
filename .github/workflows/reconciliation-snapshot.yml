name: Reconciliation snapshot

on:
  push:
    branches: [chore/pr-reconciliation-snapshot-20260919]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the reviewed main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bee1172c99a78acd7de9f1aa4ab0808f25b7dc0
          persist-credentials: false
      - name: Minimum supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'
      - name: Install validation tools without changing repository files
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          mkdir -p validation-runtime
          cp "$(command -v node)" validation-runtime/node
          cp package-lock.json validation-runtime/baseline-package-lock.json
          npm ls --all --json > validation-runtime/installed.json || test "$?" = 1
          tar -czf validation-runtime/dependencies.tar.gz node_modules
          cd validation-runtime
          sha256sum node dependencies.tar.gz > SHA256SUMS
      - name: Export temporary runtime for local tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconciliation-validation-runtime
          path: validation-runtime/
          retention-days: 1
          if-no-files-found: error
