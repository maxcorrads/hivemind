name: Validate and push reviewed repairs
on:
  push:
    branches: [maintenance/review-repair-workspace-20260918]
    paths: [repairs/current.json]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: reviewed-pr-repair-writes
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Provision launcher syntax test prerequisite
        run: sudo apt-get update -qq && sudo apt-get install --yes zsh
      - name: Test exact trees and fast-forward unchanged PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_update_notifier: 'false'
        run: python3 repairs/apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-results-${{ github.run_number }}
          path: repair-results/
          retention-days: 7
