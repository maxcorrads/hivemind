name: Read coordination CodeQL diagnostics

# Isolated diagnostic branch; never merged into the implementation or main.
on:
  push:
    branches: [agent/coordination-codeql-diagnostics]
    paths: [.github/workflows/coordination-diagnostics.yml]

permissions:
  checks: read
  contents: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing check annotations without executing repository code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/maxcorrads/hivemind/check-runs/105692456394/annotations?per_page=100' \
            > diagnostics/annotations.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('diagnostics/annotations.json').read_text())
          assert isinstance(data, list)
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coordination-codeql-diagnostics
          path: diagnostics
          retention-days: 1
