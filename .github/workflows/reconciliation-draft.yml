name: Reconcile unpublished release draft

# Temporary object preparation only. This never updates main, the release PR,
# tags or releases. The connector verifies the resulting tree before use.
on:
  push:
    branches: [chore/reconciliation-object-staging-20260919]
    paths: [.github/workflows/reconciliation-draft.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact final main without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 131e4401b2e62f6f5f84973ef2bef3ff6caa8f3d
          fetch-depth: 0
          persist-credentials: false
      - name: Retain pending release notes and change root versions only
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6b3cff8194fd6f1bdf18a80a986b4e815d714033 -- CHANGELOG.md .release-please-manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (data.version !== '0.1.0') throw new Error('Unexpected root version');
            data.version = '0.2.0';
            if (file === 'package-lock.json') {
              if (data.packages[''].version !== '0.1.0') throw new Error('Unexpected lock version');
              data.packages[''].version = '0.2.0';
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE
          git add package.json package-lock.json
          tree=$(git write-tree)
          test "$tree" = 351069a8ee4153e8154c130fa0dac85a2c6b9b7c
          git diff --exit-code 131e4401b2e62f6f5f84973ef2bef3ff6caa8f3d "$tree" -- .github/workflows
          git diff --cached --stat
          commit=$(printf '%s\n' 'chore: stage unpublished 0.2.0 draft on final reviewed main' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p 131e4401b2e62f6f5f84973ef2bef3ff6caa8f3d)
          git update-ref refs/heads/reconciliation/pr-73-draft-objects-20260919 "$commit"
          mkdir -p "$RUNNER_TEMP/draft-receipt"
          printf '{"commit":"%s","tree":"%s"}\n' "$commit" "$tree" > "$RUNNER_TEMP/draft-receipt/result.json"
      - name: Export to a non-product staging ref only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin refs/heads/reconciliation/pr-73-draft-objects-20260919
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconciliation-draft-receipt
          path: ${{ runner.temp }}/draft-receipt/
          retention-days: 1
