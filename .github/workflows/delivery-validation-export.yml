name: Delivery validation workspace
on:
  push:
    branches: [validation/delivery-integration-20260919]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Prepare isolated source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p /tmp/hive-workspace
          git bundle create /tmp/hive-workspace/repository.bundle --all
          tar -czf /tmp/hive-workspace/workspace.tar.gz --exclude=.git --exclude=artifacts --exclude=.github/workflows/delivery-validation-export.yml .
          node --version > /tmp/hive-workspace/runtime.txt
          git rev-parse HEAD >> /tmp/hive-workspace/runtime.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-validation-workspace
          path: /tmp/hive-workspace/
          retention-days: 1
