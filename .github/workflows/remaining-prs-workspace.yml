name: Remaining PR workspace
on:
  push:
    branches: [validation/remaining-prs-20260919]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Export reproducible source and local validation tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p /tmp/remaining-workspace /tmp/browser-tools
          npm install --prefix /tmp/browser-tools --ignore-scripts @playwright/test@1.63.0
          git bundle create /tmp/remaining-workspace/repository.bundle --all
          tar -czf /tmp/remaining-workspace/workspace.tar.gz --exclude=.git --exclude=artifacts --exclude=.github/workflows/remaining-prs-workspace.yml .
          tar -czf /tmp/remaining-workspace/browser-tools.tar.gz -C /tmp/browser-tools .
          cp "$(command -v node)" /tmp/remaining-workspace/node-22.13.0
          node --version > /tmp/remaining-workspace/runtime.txt
          git rev-parse HEAD >> /tmp/remaining-workspace/runtime.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-prs-workspace
          path: /tmp/remaining-workspace/
          retention-days: 1
